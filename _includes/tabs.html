<nav class="tabs">
  <ul>
    {% for item in page.tabs %}
      {%- assign page_url = page.url | relative_url -%}
      {%- assign item_url = item.url | relative_url -%}
      <li class="{% if page_url == item_url or page.permalink == item.url %}active{% endif %}">
        <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
      </li>
    {% endfor %}
  </ul>
</nav>
